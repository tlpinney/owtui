[package]
name = "owtui"
version = "0.1.0"
edition = "2021"
description = "Unofficial terminal UI for reviewing and correcting OpenWhispr dictation history (not affiliated with OpenWhispr)"
license = "Apache-2.0"
readme = "README.md"
keywords = ["openwhispr", "dictation", "tui", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = "3"

[dev-dependencies]
tempfile = "3"
