[project]
name = "owtui"
version = "0.1.0"
description = "Terminal UI for browsing and editing OpenWhisper history, dictionary, snippets and cleanup prompt"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
owtui = "owtui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owtui"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
